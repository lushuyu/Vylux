name: Build immutable fork image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character Vylux commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vylux
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable source
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          echo "IMAGE_TAG=git-${SOURCE_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify checked-out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            COMMIT=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

      - name: Record immutable image
        shell: bash
        run: |
          {
            echo "## Immutable fork image"
            echo
            echo "\\`$IMAGE_NAME:$IMAGE_TAG@${{ steps.build.outputs.digest }}\\`"
            echo
            echo "Source: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
